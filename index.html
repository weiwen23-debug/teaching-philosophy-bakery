<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Teaching Philosophy Bakery</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#3c2a28;background:#fff8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:35px auto;padding:20px}.panel{background:white;border:1px solid #f0d9c6;border-radius:24px;padding:clamp(22px,5vw,46px);box-shadow:0 12px 35px #7d4c2812}h1{font-size:clamp(2rem,5vw,3.4rem);margin:8px 0}h2{font-size:1.55rem}p{line-height:1.6}.eyebrow{color:#a45b3d;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}.muted{color:#76635e}.button,button{font:inherit;cursor:pointer}.button{background:#9d4e38;color:white;border:0;padding:14px 22px;border-radius:14px;font-weight:700}.button:hover{background:#7c3928}.button:focus-visible,.choice:focus-visible{outline:3px solid #e8a345;outline-offset:3px}.choice{display:block;text-align:left;width:100%;border:2px solid #f0dfd3;background:#fffaf6;border-radius:15px;padding:16px;margin:12px 0;color:#3c2a28}.choice:hover{border-color:#b26b49;background:#fff3e8}.choice.selected{border-color:#9d4e38;background:#fce8dc}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}.ghost{background:transparent;border:1px solid #c9a99a;color:#654537;border-radius:12px;padding:12px 18px}.bar{height:9px;background:#f4e5da;border-radius:20px;overflow:hidden;margin:22px 0}.fill{height:100%;background:#bb7653;transition:width .25s}.emoji{font-size:4rem}.tag{display:inline-block;background:#fcebd9;color:#7b442d;padding:7px 12px;border-radius:30px;font-size:.85rem;font-weight:700;margin:4px}.hidden{display:none}.result{background:#fff5e9;padding:20px;border-radius:18px;margin:20px 0}.footer{font-size:.85rem;color:#806b64;margin-top:20px}#choices{margin-top:20px}@media print{body{background:white}.actions,.no-print{display:none!important}.panel{box-shadow:none;border:0}}textarea{display:block;width:100%;margin:10px 0 22px;padding:14px;border:1px solid #d7bbaa;border-radius:12px;font:inherit;line-height:1.5;resize:vertical}label{display:block;line-height:1.5}@media print{textarea{border:1px solid #aaa;min-height:75px}}.pastry-image{display:block;width:min(100%,320px);height:auto;margin:14px auto;border-radius:20px}.partner{display:flex;align-items:center;gap:16px}.partner img{width:125px;max-width:38%;border-radius:14px}.partner p{margin:5px 0}@media print{.pastry-image{width:170px}.partner img{width:90px}}</style></head><body><main class="wrap"><section class="panel" id="app" aria-live="polite"></section></main><script>
const SUBMISSION_URL='https://script.google.com/macros/s/AKfycbyAlwCOCLpZZ1WLeeMjexm110AhDzIDQIWsTQPIWdZ9OQQthdftbqA9yRYtxIGaY9HI/exec';
let submitted=false;
const profiles=[
{name:'Parmesan Cheese Shio Pan',role:'The Steady Nurturer',emoji:'🥖',philosophy:'Care ethics and foundational learning',desc:'You build trust, routines and strong foundations. Students know they are safe, supported and capable of growing.',strength:'Creating security, consistency and belonging',stretch:'Make room for student choice even when routines work well.',motto:'A strong foundation helps every child rise.'},
{name:'Fruit Danish',role:'The Inclusive Gardener',emoji:'🍓',philosophy:'Inclusive and differentiated education',desc:'You notice each child’s strengths and needs. You adapt pathways so different learners can experience success.',strength:'Seeing and supporting individual differences',stretch:'Balance personalisation with sustainable classroom routines.',motto:'Different learners, equally worthy of flourishing.'},
{name:'Maple Walnut Danish',role:'The Reflective Sage',emoji:'🍁',philosophy:'Reflective practice and metacognition',desc:'You make space for thinking, connections and reflection. You want students to understand how and why they learn.',strength:'Deep thinking and meaningful reflection',stretch:'Pair reflection with timely action and experimentation.',motto:'Learning deepens when we think about our thinking.'},
{name:'Cheese Kouign Amann',role:'The Master Craftsman',emoji:'🧀',philosophy:'Mastery learning and explicit instruction',desc:'You believe in clarity, high expectations, feedback and deliberate practice. You design learning carefully so success is attainable.',strength:'Clear teaching and purposeful practice',stretch:'Allow students more opportunities to discover their own routes.',motto:'Excellence grows through care and practice.'},
{name:'Mentaiko Chicken Sauce with Bonito Flakes',role:'The Bold Innovator',emoji:'🔥',philosophy:'Progressive and innovative education',desc:'You try fresh approaches, make learning relevant and are willing to challenge routines when students could benefit.',strength:'Creativity and responsiveness to change',stretch:'Check whether novelty leads to deeper learning.',motto:'A new approach can open a new door.'},
{name:'Chicken Ham Focaccia',role:'The Community Builder',emoji:'🤝',philosophy:'Social constructivism and collaborative learning',desc:'You believe learning grows through dialogue, relationships and shared experiences. Your classroom feels like a team.',strength:'Collaboration, relationships and shared ownership',stretch:'Ensure every individual has thinking time and accountability.',motto:'We learn more when we learn together.'},
{name:'Jalapeños Soft French',role:'The Courageous Challenger',emoji:'🌶️',philosophy:'Growth mindset and productive struggle',desc:'You encourage students to take sensible risks, persist through difficulty and learn from mistakes.',strength:'Resilience and appropriately challenging learning',stretch:'Provide scaffolds so challenge stays productive.',motto:'A little challenge helps us grow.'},
{name:'Pistachio Twister',role:'The Curious Explorer',emoji:'🌱',philosophy:'Inquiry-based and constructivist learning',desc:'You value questions, exploration and evidence. You want students to investigate and build understanding for themselves.',strength:'Curiosity, investigation and student agency',stretch:'Use explicit teaching when students need a stronger starting point.',motto:'Every good question starts a journey.'},
{name:'Cinnamon Hot Cross Bun',role:'The Values Keeper',emoji:'❤️',philosophy:'Holistic and values-centred education',desc:'You see education as the development of both mind and character. You deliberately nurture empathy, integrity and responsibility.',strength:'Character, purpose and whole-child development',stretch:'Make values visible through concrete learning experiences.',motto:'What children become matters as much as what they know.'}
];
// Each response maps to one of nine teaching orientations. The quiz is an informal reflection, not a validated assessment.
const questions=[
{q:'It is the first week with a new class. What matters most to you?',a:[[0,'Build trust and establish reassuring routines.'],[1,'Understand the different learners in front of me.'],[5,'Help everyone feel part of the class community.'],[8,'Set a tone of kindness and mutual respect.']]},
{q:'A student says, “I cannot do this.” Your instinct is to…',a:[[6,'Help them see that struggle is part of learning.'],[0,'Reassure them and break the task into manageable steps.'],[3,'Model the method, then practise together.'],[1,'Offer a different route that suits their needs.']]},
{q:'You have one free period to design a memorable Science lesson. You choose…',a:[[7,'A hands-on investigation driven by student questions.'],[4,'An unexpected digital or creative learning experience.'],[5,'A team challenge requiring discussion and collaboration.'],[3,'A carefully sequenced lesson with feedback and practice.']]},
{q:'What would you most like a student to say at the end of the year?',a:[[8,'“I became a kinder and more responsible person.”'],[6,'“I learned not to give up when things got hard.”'],[2,'“I understand how I learn best.”'],[1,'“My teacher saw what made me unique.”']]},
{q:'When a lesson does not go as planned, you tend to…',a:[[2,'Reflect on what happened and what it teaches me.'],[4,'Try a different approach next time.'],[3,'Identify the learning gap and reteach it clearly.'],[7,'Ask what students were thinking and investigate their ideas.']]},
{q:'Which classroom scene makes you happiest?',a:[[5,'Students building ideas together in lively discussion.'],[7,'Students asking questions I had not anticipated.'],[0,'A calm classroom where everyone feels secure.'],[6,'Students persevering through a difficult task.']]},
{q:'A student completes work much faster than peers. You…',a:[[1,'Offer a pathway matched to their readiness.'],[7,'Invite them to explore a deeper question.'],[3,'Give a meaningful extension that builds mastery.'],[4,'Let them create an unconventional way to demonstrate learning.']]},
{q:'Which professional learning session would you choose?',a:[[2,'Reflective dialogue about our teaching decisions.'],[4,'Trying emerging tools and new pedagogies.'],[8,'Embedding values and character in everyday lessons.'],[5,'Designing collaborative learning experiences.']]},
{q:'A group makes a mistake during a project. You…',a:[[6,'Encourage another attempt and normalise setbacks.'],[2,'Ask them to explain what they learned from the mistake.'],[5,'Guide the group to listen and solve it together.'],[8,'Discuss honesty, responsibility and how they treated one another.']]},
{q:'When planning assessment, you prioritise…',a:[[3,'Clear success criteria and actionable feedback.'],[1,'Different ways for students to show understanding.'],[0,'Checks that help every child feel supported.'],[2,'Self-assessment and reflection on learning.']]},
{q:'Which statement best captures your view of a good teacher?',a:[[8,'We nurture good people, not just good grades.'],[3,'We make complex learning clear and achievable.'],[4,'We keep improving and dare to do things differently.'],[7,'We awaken curiosity and independent thinking.']]},
{q:'You are asked to lead a school improvement effort. You would first…',a:[[5,'Bring colleagues together to co-create the approach.'],[1,'Listen to diverse needs before deciding.'],[6,'Set an ambitious but achievable challenge.'],[0,'Build trust and stable processes for everyone.']]},
{q:'Which teaching moment feels most rewarding?',a:[[7,'A child discovers something through investigation.'],[8,'A child chooses to do the right thing without prompting.'],[4,'An unusual idea makes learning come alive.'],[6,'A child succeeds after several attempts.']]},
{q:'What would you most like to strengthen next year?',a:[[0,'Classroom relationships and predictable routines.'],[2,'Reflection and student metacognition.'],[3,'Scaffolding and effective feedback.'],[5,'Peer learning and collective responsibility.']]},
{q:'Your ideal learning experience helps children…',a:[[1,'Find an approach that works for them.'],[4,'Connect learning to new and changing realities.'],[8,'Make thoughtful choices grounded in values.'],[7,'Ask, test and refine their own explanations.']]},
{q:'Which message would you most want to leave with your pupils?',a:[[6,'Be brave enough to try again.'],[5,'Lift others as you learn.'],[2,'Pause, think and learn from experience.'],[0,'You belong, and you can grow.']]},
{q:'A student questions your explanation. You…',a:[[7,'Invite the class to test the claim using evidence.'],[2,'Explore the reasoning behind both viewpoints.'],[4,'Welcome the challenge and rethink the approach.'],[3,'Clarify the concept using a precise example.']]},
{q:'At the heart of your teaching philosophy is…',a:[[8,'Helping children grow in character.'],[1,'Making sure every learner has a fair chance.'],[5,'Learning through relationships and community.'],[3,'Helping every student achieve secure understanding.']]}
];
let index=-1,answers=Array(questions.length).fill(null);const app=document.getElementById('app');
function intro(){index=-1;app.innerHTML=`<div class="eyebrow">A professional learning experience</div><h1>🥐 The Teaching Philosophy Bakery</h1><p>What kind of pastry reflects the teacher you are?</p><p>Explore 18 everyday Singapore primary school classroom situations. Choose the response closest to your instinct — not what you think is the “correct” answer.</p><p class="muted">About 5–7 minutes · A surprise teaching-flavour reveal · Your name and answers are sent only if you choose to submit your completed reflection</p><button class="button" id="start">Enter the bakery →</button><p class="footer">A playful reflection tool, not a psychological or professional assessment. All nine orientations have value.</p>`;document.getElementById('start').onclick=()=>{index=0;render()}}
function render(){if(index>=questions.length)return results();let item=questions[index];app.innerHTML=`<div class="eyebrow">Your teaching instincts</div><div class="bar"><div class="fill" style="width:${100*index/questions.length}%"></div></div><p class="muted">Question ${index+1} of ${questions.length}</p><h2>${item.q}</h2><div id="choices"></div><div class="actions"><button class="ghost" id="back">← Back</button><button class="button" id="next" ${answers[index]===null?'disabled':''}>${index===questions.length-1?'Reveal my pastry →':'Next →'}</button></div>`;const box=document.getElementById('choices');item.a.forEach(([id,label],j)=>{let b=document.createElement('button');b.className='choice'+(answers[index]===id?' selected':'');b.textContent=label;b.setAttribute('aria-pressed',String(answers[index]===id));b.onclick=()=>{answers[index]=id;render()};box.appendChild(b)});document.getElementById('back').onclick=()=>{if(index===0)intro();else{index--;render()}};document.getElementById('next').onclick=()=>{if(answers[index]!==null){index++;render()}}}

/* Pastry illustrations are embedded as SVG data images so the game works offline. */
const partners=[7,3,6,1,8,2,0,3,4];
const partnerReasons=[
'Your reliable routines create the security that makes open inquiry possible. Their curiosity can help you make more room for student questions.',
'Your flexible pathways help all learners access the ambitious goals and clear feedback your partner brings.',
'Your reflective questions help make sense of the risks and challenges your partner encourages pupils to take.',
'Your explicit teaching and high expectations pair with their attention to different learner needs.',
'Your creative experiments gain depth when anchored in the values and purpose your partner foregrounds.',
'Your collaborative classroom culture is strengthened by their attention to individual thinking and reflection.',
'Your willingness to stretch pupils is balanced by their attention to trust, safety and scaffolding.',
'Your inquiry approach benefits from their clear explanations and deliberate checks for understanding.',
'Your focus on character gives purpose to their creative approaches; their innovation can help make values tangible.'
];

 const base=['#d79b5c','#edb05c','#b77a43','#b66d37','#d9a05e','#c28a55','#dca16d','#b99464','#bc814a'][id];
 const shapes=[
 `<path d="M80 175 Q35 145 74 105 Q113 72 185 98 Q233 112 240 155 Q242 190 191 202 Q112 220 80 175Z" fill="${base}" stroke="#9e6237" stroke-width="6"/><path d="M89 141 Q146 105 224 154" fill="none" stroke="#fff0b7" stroke-width="12" stroke-linecap="round"/><path d="M103 170 Q164 139 217 180" fill="none" stroke="#f6dc91" stroke-width="8" stroke-linecap="round"/>`,

 `<ellipse cx="160" cy="164" rx="104" ry="62" fill="${base}" stroke="#a16c3f" stroke-width="7"/><path d="M77 157 Q128 114 233 153" fill="none" stroke="#f9d8a2" stroke-width="24" stroke-linecap="round"/><path d="M86 149 Q144 102 227 145" fill="none" stroke="#f19b73" stroke-width="15" stroke-linecap="round"/><g fill="#d6a47e"><path d="M113 124 l12 -22 12 24Z"/><path d="M167 111 l12 -22 12 24Z"/><path d="M206 128 l12 -22 12 24Z"/></g>`,
 `<path d="M59 163 Q62 107 114 103 L205 103 Q259 109 260 164 L245 216 L73 216Z" fill="${base}" stroke="#95603d" stroke-width="7"/><path d="M69 169 L251 169" stroke="#fff1c8" stroke-width="22"/><path d="M79 174 L238 174" stroke="#ce766e" stroke-width="10"/><g fill="#698c4c"><ellipse cx="119" cy="132" rx="16" ry="8"/><ellipse cx="186" cy="130" rx="18" ry="8"/></g>`,
 `<path d="M65 169 Q65 115 113 107 Q161 79 210 107 Q257 123 256 169 Q249 218 159 224 Q78 219 65 169Z" fill="${base}" stroke="#9f6a3c" stroke-width="7"/><path d="M93 144 Q160 110 229 145" stroke="#f9d9a2" stroke-width="12" fill="none"/><g fill="#44844d" stroke="#2b6435" stroke-width="3"><ellipse cx="118" cy="147" rx="14" ry="9"/><ellipse cx="174" cy="129" rx="14" ry="9"/><ellipse cx="208" cy="169" rx="14" ry="9"/></g>`,
 `<path d="M100 70 Q235 75 195 137 Q105 170 209 215 Q251 242 181 243 Q72 218 128 154 Q170 120 90 101Z" fill="${base}" stroke="#94633e" stroke-width="8"/><path d="M111 95 Q202 106 159 143 Q114 179 206 224" stroke="#73964e" stroke-width="18" fill="none"/><path d="M125 85 Q217 114 156 160 Q119 190 194 235" stroke="#f1dba1" stroke-width="8" fill="none"/>`,
 `<path d="M72 179 Q57 100 125 90 Q159 58 198 89 Q262 103 247 179 Q233 233 158 232 Q83 231 72 179Z" fill="${base}" stroke="#935b36" stroke-width="8"/><path d="M158 89 L158 221 M91 157 L224 157" stroke="#fff0c6" stroke-width="16" stroke-linecap="round"/><g fill="#9c592f"><circle cx="117" cy="124" r="5"/><circle cx="201" cy="122" r="5"/><circle cx="117" cy="196" r="5"/><circle cx="202" cy="195" r="5"/></g>`
 ];
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300"><rect width="320" height="300" rx="24" fill="#fff0de"/><ellipse cx="160" cy="245" rx="119" ry="22" fill="#d8bca3" opacity=".5"/>${shapes[id]}</svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

const insights=[
['Children learn best when they feel safe, known and supported.','You tend to establish trust, routines and scaffolds before increasing independence.','When might a supportive routine unintentionally limit student agency?','Invite pupils to choose one way to demonstrate understanding within a clear routine.'],
['Learners differ in readiness, interests and the support they need.','You look for flexible pathways and multiple ways to access or demonstrate learning.','How do you maintain ambitious expectations for everyone while adapting support?','Offer two purposeful task pathways with a shared learning goal.'],
['Learning becomes deeper when we make thinking visible and examine our experiences.','You invite explanation, self-assessment and reflection rather than stopping at the answer.','Are pupils reflecting on specific evidence or simply saying how they feel?','Use a short exit reflection: What changed in my thinking, and why?'],
['Clarity, feedback and deliberate practice help all pupils succeed.','You sequence explanations, model thinking and check for secure understanding.','When might too much modelling reduce productive independent thinking?','After modelling, let pupils compare two possible methods and justify a choice.'],
['Teaching should evolve when fresh approaches improve learning.','You experiment with tools, contexts and creative approaches to make ideas accessible.','How do you distinguish genuine learning gains from novelty and excitement?','Test one new approach against a clear learning outcome and pupil evidence.'],
['Knowledge is co-constructed through talk, relationships and shared work.','You plan peer discussion, group problem-solving and a sense of collective responsibility.','Whose voices may be missing when collaboration looks successful?','Give every pupil individual think time before a structured group discussion.'],
['Students grow when challenges are meaningful and mistakes are treated as information.','You encourage persistence, revision and confidence through achievable stretch.','How can you tell when struggle is productive rather than overwhelming?','Give a challenging task with a hint ladder pupils can choose to use.'],
['Understanding grows when pupils investigate, question and test ideas.','You make room for exploration, evidence, student questions and independent explanations.','When would a concise explanation help pupils inquire more effectively?','Begin with a puzzling observation and let pupils propose what evidence to collect.'],
['Education develops character, relationships and responsibility alongside academic learning.','You explicitly connect daily decisions and interactions to values and citizenship.','Are values experienced through pupil choices or mainly discussed in words?','Use a real classroom dilemma to let pupils practise respectful decision-making.']
];
function results(){submitted=false;let scores=profiles.map((_,i)=>answers.filter(x=>x===i).length);let order=profiles.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]||a-b);let top=order[0],p=profiles[top],secondary=order.find(i=>i!==top&&scores[i]>0),ins=insights[top];app.innerHTML=`<div class="eyebrow">Your personal teaching philosophy summary</div><img class="pastry-image" src="${pastryPicture(top)}" alt="Illustration of ${p.name}"><h1>${p.name}</h1><h2>${p.role}</h2><div class="tag">${p.philosophy}</div><p class="muted">Your pastry is a playful metaphor for the beliefs you prioritised in these classroom dilemmas. It is not a label or a judgement of your teaching.</p><div class="result"><h2>What you believe about learning</h2><p>${ins[0]}</p><h2>How this may show up in your classroom</h2><p>${ins[1]}</p><h2>Your distinctive strength</h2><p>${p.strength}.</p><h2>A possible blind spot</h2><p>${p.stretch}</p><p><em>“${p.motto}”</em></p></div><div class="result"><h2>Your Teaching Flavour Partner</h2><div class="partner"><img src="${pastryPicture(partners[top])}" alt="Illustration of ${profiles[partners[top]].name}"><div><strong>${profiles[partners[top]].name}</strong><p>${profiles[partners[top]].role}</p><p>${profiles[partners[top]].philosophy}</p></div></div><p>${partnerReasons[top]}</p><p><strong>Reflect:</strong> What could a colleague with this philosophy help me notice or do differently in my classroom?</p><p class="muted">This is a complementary perspective, not a fixed compatibility score.</p></div><h2>Look beneath your teaching decisions</h2><p><strong>Question worth asking:</strong> ${ins[2]}</p><p><strong>One classroom move to try:</strong> ${ins[3]}</p>${secondary!==undefined?`<p><strong>Another belief you also seem to value:</strong> ${profiles[secondary].role} (${profiles[secondary].philosophy}). Our beliefs are rarely just one flavour.</p>`:''}<h2>From beliefs to classroom practice</h2><p>Think about what pupils actually experience, not just what you intend.</p><label for="evidence"><strong>1. Recall a recent lesson. What specific teaching decision showed this belief in action?</strong></label><textarea id="evidence" rows="3" placeholder="What did I do? What did pupils experience?"></textarea><label for="tension"><strong>2. When did time, assessment or syllabus coverage make it hard to act on this belief?</strong></label><textarea id="tension" rows="3" placeholder="What did I prioritise, and what was the trade-off?"></textarea><label for="action"><strong>3. What is one change I will try so that my practice better reflects my beliefs?</strong></label><textarea id="action" rows="3" placeholder="In my next lesson, I will... because..."></textarea><p class="muted">For dialogue with a colleague: Would your pupils recognise this teaching philosophy in your lessons? What evidence would they point to?</p><div class="result no-print"><h2>Submit your reflection to the facilitator</h2><p>Your name, teaching level (if provided), all 18 choices, personality result and written reflections will be stored in a private Google Sheet accessible to the activity facilitators. Please do not include student names or identifying details in your reflections. This is for professional learning, not appraisal.</p><label for="teacherName"><strong>Your name (required)</strong></label><input id="teacherName" maxlength="120" autocomplete="name" placeholder="Your full name" style="width:100%;padding:12px;border:1px solid #bba594;border-radius:8px;margin:7px 0 14px"><label for="level"><strong>Teaching level (optional)</strong></label><select id="level" style="width:100%;padding:12px;border:1px solid #bba594;border-radius:8px;margin:7px 0 14px"><option value="">Prefer not to say</option><option>Lower Primary</option><option>Upper Primary</option><option>Both</option><option>Other</option></select><label style="display:flex;gap:10px;align-items:flex-start;margin:12px 0"><input id="consent" type="checkbox" style="margin-top:5px"><span>I understand what is being collected and agree to submit my named responses for this staff professional learning activity.</span></label><button class="button" id="submit" type="button">Submit my reflection</button><p id="submitStatus" role="status" aria-live="polite"></p></div><div class="actions no-print"><button class="ghost" id="restart">↻ Start again</button><button class="button" id="print">Print / Save my philosophy summary</button></div><p class="footer">A reflective conversation starter, not a validated assessment or appraisal tool. All nine teaching orientations offer value; strong practice draws on more than one.</p>`;document.getElementById('submit').onclick=()=>submitReflection({top,secondary,scores});document.getElementById('restart').onclick=()=>{answers.fill(null);intro()};document.getElementById('print').onclick=()=>{['evidence','tension','action'].forEach(id=>{let e=document.getElementById(id);e.textContent=e.value});window.print()}}

function submitReflection({top, secondary, scores}) {
  const status = document.getElementById('submitStatus');
  const button = document.getElementById('submit');
  const name = document.getElementById('teacherName').value.trim();

  // Prevent duplicate submissions
  if (submitted) {
    status.textContent = 'This response has already been sent.';
    return;
  }

  // Name is compulsory for pastry collection
  if (name.length < 2) {
    status.textContent =
      'Please enter your full name so we can identify your pastry.';
    document.getElementById('teacherName').focus();
    return;
  }

  // Consent is compulsory
  if (!document.getElementById('consent').checked) {
    status.textContent =
      'Please confirm that you agree to submit your named responses.';
    return;
  }

  // Check Google Apps Script URL
  if (!/^https:\/\/script\.google\.com\/(?:a\/macros\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(SUBMISSION_URL)) {
    status.textContent =
      'The facilitator has not configured the Google Sheets submission link yet.';
    return;
  }

  // Prepare teacher responses
  const payload = {
    name,
    level: document.getElementById('level').value,
    answers: [...answers],
    scores,
    pastry: profiles[top].name,
    role: profiles[top].role,
    philosophy: profiles[top].philosophy,
    secondary: secondary === undefined
      ? ''
      : profiles[secondary].philosophy,
    evidence: document.getElementById('evidence').value,
    tension: document.getElementById('tension').value,
    action: document.getElementById('action').value
  };

  // Unique submission reference
  const requestId =
    'bakery-' + Date.now() + '-' +
    Math.random().toString(36).slice(2);

  // Create hidden iframe
  const iframe = document.createElement('iframe');
  iframe.name = 'submission_' + requestId;
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  // Create submission form
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = SUBMISSION_URL;
  form.target = iframe.name;
  form.style.display = 'none';

  // Add submission data
  for (const [key, value] of Object.entries({
    requestId,
    payload: JSON.stringify(payload)
  })) {
    const field = document.createElement('input');
    field.name = key;
    field.value = value;
    form.appendChild(field);
  }

  document.body.appendChild(form);

  // Prevent repeated clicks
  button.disabled = true;
  button.textContent = 'Submitted';

  // Send response to Google Sheets
  form.submit();

  submitted = true;

  // Display thank-you message
  status.textContent =
    'Thank you, ' + name + '! 🥐 ' +
    'Your teaching philosophy and reflections have been sent. ' +
    'Please show your pastry result to the facilitator. ' +
    'Enjoy your pastry!';

  // Clean up hidden elements
  setTimeout(() => {
    form.remove();
    iframe.remove();
  }, 30000);
}
}

intro();</script></body></html>
